<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Every Crazy Boy Jack YouTube channel, TikTok, Instagram and Facebook page in one place.">
<meta name="theme-color" content="#080404">
<meta property="og:type" content="website">

<meta property="og:description" content="Every Crazy Boy Jack YouTube channel and social in one place.">
<meta property="og:image" content="assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<a class="skip" href="#channels">Skip to channels</a>
<div class="banner" role="img" aria-label="Crazy Boy Jack banner"></div>

<div class="layout">
  <header class="profile">
    <img class="avatar" src="assets/avatar.webp" alt="Crazy Boy Jack logo" width="120" height="120">
    <h1>Crazy Boy Jack</h1>
    <p class="tag">All my channels and socials in one place.</p>
    <nav class="socials" id="socials" aria-label="Social links">
      <noscript><a class="btn yt" href="https://www.youtube.com/@CrazyBoyJack">YouTube</a></noscript>
    </nav>
    <button class="share" id="share" type="button">Share this page</button>
  </header>

  <main id="channels">
    <h2>All Other YouTube Channels</h2>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No channel matches that search. <button type="button" id="clear">Clear search</button></p>
  </main>
</div>

<footer>© Crazy Boy Jack</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>

</html>
